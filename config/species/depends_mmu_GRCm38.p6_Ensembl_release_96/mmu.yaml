outdir: /media/nfs/nfs02/yuzhij/Project/placeholder_outdir

# 2026-10-20 修复: 原路径指向已废弃的旧服务器(/media/sda,/media/sdc)，已全部改为本账户本地路径
# 注意: 原 R96 注释的基因组索引(GRCm38.96)本地与 liudy 账户均无副本，genome/gtf 暂用本地
# release-89 等价路径(与 depends_mmu_GRCm38.p6_Ensembl_release_89 相同)。
# 如确需 R96 注释，需另行下载 Ensembl release-96 并重建 HISAT2 索引。
ruledir: /media/nfs/nfs02/yuzhij/pipeline/auto_RNA_Seq_analysis.v4/rule
database:
  genome:
    - /media/nfs/nfs02/yuzhij/pipeline/database/Ensembl/release-89/mus_musculus/Hisat2Index_ss_exon/mm10_tran
  gene:
    - /media/nfs/nfs02/yuzhij/pipeline/BGI_RNA_seq/mm10_refMrna/refMrna.fa.index
  gtf: /media/nfs/nfs02/yuzhij/pipeline/database/Ensembl/release-89/mus_musculus/gtf/Mus_musculus.GRCm38.89.protein_coding.gtf
  des: /media/nfs/nfs02/yuzhij/pipeline/auto_RNA_Seq_analysis.v4/depends_mmu_GRCm38.p6_Ensembl_release_96/gene_description.txt
  depends: /media/nfs/nfs02/yuzhij/pipeline/auto_RNA_Seq_analysis.v4/depends_mmu_GRCm38.p6_Ensembl_release_96
  ppi: /media/nfs/nfs02/yuzhij/pipeline/auto_RNA_Seq_analysis.v4/depends_mmu_GRCm38.p6_Ensembl_release_96/rename.uniq.10090.protein.links.v10.5.txt

software:
  anaconda:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq/bin
  snakemake:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq/bin/snakemake
  fastqc:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq/bin/fastqc
  hisat2:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq/bin/hisat2
    - "--dta --dta-cufflinks"
  stringtie:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq/bin/stringtie
  java:
    - /usr/bin/java
  samtools:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq/bin/samtools
  gsea:
    - /media/nfs/nfs02/yuzhij/biosoft/gsea-3.0.jar
  gsva:
    - /media/nfs/nfs02/yuzhij/pipeline/auto_RNA_Seq_analysis.v4/depends_F.catus_Fca126_mat1.0_NCBI_release_105/gsva_all.r
    - /media/nfs/nfs02/yuzhij/pipeline/auto_RNA_Seq_analysis.v4/depends_F.catus_Fca126_mat1.0_NCBI_release_105/gsva_deg.r
  soap:
    - /media/nfs/nfs02/yuzhij/biosoft/soap2.21release/bin/soap
    - "-m 0 -x 1000 -s 28 -l 32 -v 2 -r 2"
  python:
    - /usr/bin/python
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq/bin/python
  R:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq-R/bin/R
  Rscript:
    - /media/nfs/nfs02/yuzhij/biosoft/mambaforge/envs/RNA-seq-R/bin/Rscript

readlength: 50
species: mmu
PEorSE: SE
step:
  FastQC: 1
  ReadsRandom: 1
  Alignment: 1
  Quantify: 1
  Comparison: 1
  Cluster: 1
  GSEA: 1
  GO: 1
  KEGG: 1
  REACTOME: 1
  PPI: 1
  GSVA: 1
